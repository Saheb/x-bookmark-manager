<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Bookmarks Viewer</title>
    <link rel="stylesheet" href="viewer.css">
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                    <path
                        d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                </svg>
                <h1>Bookmarks</h1>
            </div>

            <div class="sidebar-stats">
                <div class="stat-card">
                    <span class="stat-value" id="total-count">0</span>
                    <span class="stat-label">Total Bookmarks</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="author-count">0</span>
                    <span class="stat-label">Authors</span>
                </div>
            </div>

            <div class="sidebar-actions">
                <button id="export-json-btn" class="action-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                    </svg>
                    Export JSON
                </button>
                <button id="export-csv-btn" class="action-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                    </svg>
                    Export CSV
                </button>
            </div>

            <div class="sidebar-footer">
                <p>Powered by Twitter Bookmark Manager</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path
                            d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                    <input type="text" id="search-input" placeholder="Search bookmarks by text, author, or handle...">
                    <button id="clear-search" class="clear-btn" style="display: none;">✕</button>
                </div>

                <div class="view-controls">
                    <button id="view-grid" class="view-btn active" title="Grid View">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M3 3h8v8H3V3zm0 10h8v8H3v-8zm10-10h8v8h-8V3zm0 10h8v8h-8v-8z" />
                        </svg>
                    </button>
                    <button id="view-list" class="view-btn" title="List View">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path
                                d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="topic-filters" id="topic-filters">
                    <!-- Topic pills will be rendered dynamically -->
                </div>
                <div class="author-filter">
                    <select id="author-select">
                        <option value="">All Authors</option>
                    </select>
                </div>
            </div>

            <!-- Results Info -->
            <div class="results-info">
                <span id="results-count">Loading bookmarks...</span>
            </div>

            <!-- Bookmarks Grid -->
            <div id="bookmarks-container" class="bookmarks-grid">
                <div class="loading-state">
                    <div class="loader"></div>
                    <p>Loading your bookmarks...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="viewer.js"></script>
</body>

</html>
